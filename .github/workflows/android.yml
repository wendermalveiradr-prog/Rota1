name: Gerar APK Rota
on: [push]
jobs:
  build:
    timeout-minutes: 25
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
      - name: Compilar APK Android Nativo
        run: |
          mkdir -p app
          keytool -genkey -v -keystore debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US" 2>/dev/null || true
          cp debug.keystore app/debug.keystore
          if [ -f "gradlew" ]; then
            chmod +x gradlew
            ./gradlew assembleDebug --no-daemon
          else
            gradle assembleDebug --no-daemon
          fi
      - name: Salvar APK para Download
        uses: actions/upload-artifact@v4
        with:
          name: Rota-AIStudio-APK
          path: "**/build/outputs/apk/debug/*.apk"
